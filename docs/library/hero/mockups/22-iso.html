<!doctype html>
<html lang="en">
<head>

        <p>Coils, ducts, and live temperatures from plant 03.</p>

        <img src="./assets/hero-iso-plant.jpg" alt="">

        <div class="chip" style="bottom:24px;right:16px;background:#c2410c;color:#fff">Roof plant 03</div>
      </div>
    </div>
